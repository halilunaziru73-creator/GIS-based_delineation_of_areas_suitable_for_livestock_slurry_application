name: Syntax Check

on:
  push:
  pull_request:

jobs:
  compile-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Compile all Python files
        run: python -m compileall -q .
